<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting... | RemotENG</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://remoteng.com.ng/logo.png">
<style>
:root {
  --blue-dark: #1e3a8a;
  --blue: #3b82f6;
  --green: #84cc16;
  --gray-900: #111827;
  --gray-700: #374151;
  --gray-500: #6b7280;
  --gray-100: #f3f4f6;
  --white: #ffffff;
  --red: #ef4444;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { max-width: 600px; width: 100%; background: var(--white); border-radius: 18px; padding: 50px 40px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 30px; }
.logo img { width: 56px; height: 56px; }
.logo-text { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.logo-text.remot { color: var(--blue-dark); }
.logo-text.eng { color: var(--blue); }
.logo-text.com { color: var(--green); font-size: 15px; display: block; margin-top: -5px; font-weight: 600; }
.spinner { width: 60px; height: 60px; border: 4px solid var(--gray-100); border-top: 4px solid var(--blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 30px auto; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
h1 { font-size: 28px; color: var(--blue-dark); margin-bottom: 16px; font-weight: 800; }
p { color: var(--gray-700); font-size: 16px; line-height: 1.7; margin-bottom: 24px; }
.status-icon { font-size: 64px; margin-bottom: 20px; }
.success { color: var(--green); }
.error { color: var(--red); }
.btn { background: var(--blue-dark); color: var(--white); padding: 14px 32px; border-radius: 10px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; display: inline-block; transition: all 0.2s; font-size: 16px; margin: 8px; }
.btn:hover { background: var(--blue); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
.btn-green { background: var(--green); color: var(--gray-900); }
.btn-green:hover { background: #65a30d; box-shadow: 0 4px 12px rgba(132,204,22,0.3); }
.btn-outline { background: var(--white); color: var(--blue-dark); border: 2px solid var(--blue-dark); }
.btn-outline:hover { background: var(--blue-dark); color: var(--white); }
.details-box { background: var(--gray-100); border-radius: 12px; padding: 24px; margin: 30px 0; text-align: left; }
.details-box h3 { font-size: 18px; color: var(--blue-dark); margin-bottom: 16px; }
.details-box p { margin-bottom: 12px; font-size: 15px; }
.details-box strong { color: var(--gray-900); }
.countdown { font-size: 14px; color: var(--gray-500); margin-top: 20px; }
.error-details { background: #fee2e2; border: 1px solid #fca5a5; border-radius: 10px; padding: 20px; margin: 24px 0; color: #991b1b; font-size: 14px; text-align: left; }
.hidden { display: none; }
@media (max-width: 768px) { .container { padding: 40px 25px; } h1 { font-size: 24px; } }
</style>
</head>
<body>
<div class="container">
<div class="logo">
<img src="https://remoteng.com.ng/logo.png" alt="RemotENG Logo">
<div class="logo-text">
<span class="remot">Remot</span><span class="eng">eng</span>
<span class="com">.com.ng</span>
</div>
</div>

<!-- Loading State -->
<div id="loading-state">
<div class="spinner"></div>
<h1>Processing...</h1>
<p>Please wait while we process your request.</p>
</div>

<!-- Success State -->
<div id="success-state" class="hidden">
<div class="status-icon success">✓</div>
<h1 id="success-title">Success!</h1>
<p id="success-message">Your request has been processed successfully.</p>
<div class="details-box" id="success-details"></div>
<div id="success-actions"></div>
<div class="countdown" id="countdown"></div>
</div>

<!-- Error State -->
<div id="error-state" class="hidden">
<div class="status-icon error">✗</div>
<h1>Something Went Wrong</h1>
<p id="error-message">We couldn't process your request. Please try again.</p>
<div class="error-details" id="error-details"></div>
<div>
<a href="index.html" class="btn">Go to Homepage</a>
<a href="https://wa.me/2349125651147" class="btn btn-outline" target="_blank">Contact Support</a>
</div>
</div>
</div>

<script>
const GO_SECRET_KEY = 'RemotENG_2026_Secure_###';
const API_URL = 'https://remoteng-api.onrender.com';

async function init() {
  const params = new URLSearchParams(window.location.search);

  // Flow 1: Job Click Tracking
  if (params.has('url') && params.has('job_id')) {
    await handleJobClick(params);
    return;
  }

  // Flow 2: Selar Payment Success - VIP
  if (params.get('success') === 'vip') {
    await handlePaymentSuccess(params, 'vip');
    return;
  }

  // Flow 3: Selar Payment Success - CV/Resume/Cover Letter/CV Review
  if (params.get('success') === 'cv' || params.get('success') === 'cover_letter' || params.get('success') === 'cv_review' || params.get('success') === 'cv_writing') {
    await handleServiceOrder(params);
    return;
  }

  // Flow 4: Selar Payment Success - Featured Job
  if (params.get('success') === 'featured') {
    await handleFeaturedJobOrder(params);
    return;
  }

  // Invalid request
  showError('Invalid request. Missing required parameters.', 'No action specified in URL.');
}

async function handleJobClick(params) {
  const jobUrl = params.get('url');
  const jobId = params.get('job_id');
  const referrer = document.referrer || 'direct';

  try {
    await fetch(`${API_URL}/api/click`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ job_id: parseInt(jobId), referrer: referrer })
    });
  } catch (err) {
    console.error('Click tracking failed:', err);
  }

  window.location.href = decodeURIComponent(jobUrl);
}

async function handlePaymentSuccess(params, type) {
  const email = params.get('email');
  const txRef = params.get('tx_ref') || params.get('transaction_id');
  const name = params.get('name') || 'Customer';

  if (!email ||!txRef) {
    showError('Payment verification failed.', 'Missing email or transaction reference from Selar.');
    return;
  }

  try {
    const res = await fetch(`${API_URL}/api/verify-payment`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-GO-Secret': GO_SECRET_KEY
      },
      body: JSON.stringify({ email: email, tx_ref: txRef, type: type, name: name })
    });

    if (!res.ok) {
      throw new Error('Payment verification failed on backend');
    }

    const data = await res.json();

    if (type === 'vip') {
      showSuccess(
        'VIP Membership Activated!',
        `Welcome to VIP, ${name}! You now have 12-hour early access to all remote jobs.`,
        {
          'Email': email,
          'Membership': 'VIP - Active',
          'Expires': data.expiry_date || 'In 30 days',
          'Next Step': 'Check your email at 7AM WAT daily for fresh job alerts'
        },
        [
          { text: 'Browse Jobs Now', url: 'remote-jobs.html', class: 'btn-green' },
          { text: 'Go to Homepage', url: 'index.html', class: 'btn-outline' }
        ]
      );
    }
  } catch (err) {
    console.error('Payment verification error:', err);
    showError(
      'Payment received but activation failed.',
      `Transaction ID: ${txRef}<br>Email: ${email}<br><br>Please contact support@remoteng.com.ng with your transaction details. We'll activate your membership manually within 1 hour.`
    );
  }
}

async function handleServiceOrder(params) {
  const email = params.get('email');
  const txRef = params.get('tx_ref') || params.get('transaction_id');
  const service = params.get('service') || params.get('success');
  const name = params.get('name') || '';

  if (!email ||!txRef) {
    showError('Order verification failed.', 'Missing email or transaction reference from Selar.');
    return;
  }

  const orderFormUrl = `order-form.html?email=${encodeURIComponent(email)}&tx_ref=${encodeURIComponent(txRef)}&service=${encodeURIComponent(service)}&name=${encodeURIComponent(name)}`;
  
  document.getElementById('loading-state').innerHTML = `
    <div class="status-icon success">✓</div>
    <h1>Payment Confirmed!</h1>
    <p>Redirecting to complete your order details...</p>
    <div class="spinner"></div>
  `;
  
  setTimeout(() => {
    window.location.href = orderFormUrl;
  }, 2000);
}

async function handleFeaturedJobOrder(params) {
  const email = params.get('email');
  const txRef = params.get('tx_ref');
  const name = params.get('name') || 'Company';
  const title = params.get('title');
  const description = params.get('description');
  const salary = params.get('salary');
  const url = params.get('url');

  if (!email ||!txRef ||!title) {
    showError('Featured job order incomplete.', 'Missing required job details from payment.');
    return;
  }

  try {
    const res = await fetch(`${API_URL}/api/order`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-GO-Secret': GO_SECRET_KEY
      },
      body: JSON.stringify({
        email: email,
        service: 'featured_job',
        tx_ref: txRef,
        name: name,
        title: title,
        description: description,
        salary: salary,
        url: url
      })
    });

    if (!res.ok) {
      throw new Error('Featured job processing failed on backend');
    }

    showSuccess(
      'Featured Job Activated!',
      `Your job "${title}" is now live with Featured status for 7 days.`,
      {
        'Company': name,
        'Job Title': title,
        'Status': 'Featured - Top of Search Results',
        'Duration': '7 days from now',
        'Visibility': '5x more applicants expected',
        'Email': email
      },
      [
        { text: 'View Your Job', url: 'remote-jobs.html', class: 'btn-green' },
        { text: 'Post Another Job', url: 'post-job.html', class: 'btn-outline' }
      ]
    );
  } catch (err) {
    console.error('Featured job error:', err);
    showError(
      'Payment received but job posting failed.',
      `Transaction ID: ${txRef}<br>Email: ${email}<br>Job: ${title}<br><br>Please contact support@remoteng.com.ng. We'll activate your featured job manually within 1 hour.`
    );
  }
}

function showSuccess(title, message, details, actions) {
  document.getElementById('loading-state').classList.add('hidden');
  document.getElementById('success-state').classList.remove('hidden');
  document.getElementById('success-title').textContent = title;
  document.getElementById('success-message').textContent = message;
  
  const detailsBox = document.getElementById('success-details');
  detailsBox.innerHTML = '<h3>Details</h3>';
  for (const [key, value] of Object.entries(details)) {
    detailsBox.innerHTML += `<p><strong>${key}:</strong> ${value}</p>`;
  }
  
  const actionsDiv = document.getElementById('success-actions');
  actionsDiv.innerHTML = '';
  actions.forEach(action => {
    const btn = document.createElement('a');
    btn.href = action.url;
    btn.className = `btn ${action.class}`;
    btn.textContent = action.text;
    actionsDiv.appendChild(btn);
  });
}

function showError(message, details) {
  document.getElementById('loading-state').classList.add('hidden');
  document.getElementById('error-state').classList.remove('hidden');
  document.getElementById('error-message').textContent = message;
  document.getElementById('error-details').innerHTML = details;
}

init();
</script>
</body>
</html>
