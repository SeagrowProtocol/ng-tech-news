    <style>
        :root { --primary: #0d6efd; --dark: #0a192f; --grey: #64748b; --light: #f8fafc; }
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: var(--light); color: var(--dark); line-height: 1.5; }
        .container { width: 92%; max-width: 1200px; margin: 0 auto; }
        
        /* HEADER */
        header { background: #fff; border-bottom: 1px solid #eee; padding: 12px 0; position: sticky; top: 0; z-index: 100; }
        nav { display: flex; justify-content: space-between; align-items: center; }

        .nav-links a { text-decoration: none; color: var(--dark); font-weight: 600; margin-left: 15px; font-size: 0.85rem; }

        /* HERO & SEARCH */
        .page-header { padding: 40px 0; text-align: center; }
        .search-box { display: flex; gap: 10px; max-width: 600px; margin: 20px auto; }
        .search-box input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .search-box button { background: var(--primary); color: #fff; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: 700; }

        /* NEWS GRID */
        .news-grid { display: grid; gap: 24px; margin: 30px 0; }
        .news-card { background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #eee; transition: 0.3s; display: flex; flex-direction: column; }
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .news-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #eee; }
        .news-content { padding: 20px; flex-grow: 1; }
        .news-content h3 { font-size: 1.2rem; margin: 0 0 10px; line-height: 1.3; }
        .news-content p { font-size: 0.9rem; color: var(--grey); margin-bottom: 15px; }
        .news-meta { font-size: 0.75rem; color: #94a3b8; display: flex; justify-content: space-between; margin-top: auto; }
        .read-more { color: var(--primary); font-weight: 700; text-decoration: none; font-size: 0.9rem; }

        @media (min-width: 768px) { .news-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .news-grid { grid-template-columns: repeat(3, 1fr); } }

        /* BUTTONS */
        .load-btn { display: block; width: 200px; margin: 40px auto; padding: 12px; border: 2px solid var(--primary); background: transparent; color: var(--primary); border-radius: 8px; font-weight: 700; cursor: pointer; }

<script>
    /* SUPABASE CONFIGURATION */
    const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    let offset = 0;

    async function fetchNews(isSearch = false) {
        const query = document.getElementById('newsSearch').value;
        const list = document.getElementById('newsList');
        
        // Construct the URL for Supabase REST API
        let url = `${SUPABASE_URL}/rest/v1/news?select=*&order=published_at.desc&limit=12&offset=${offset}`;
        
        if (isSearch && query) {
            url += `&or=(title.ilike.%${query}%,summary.ilike.%${query}%)`;
            list.innerHTML = ''; // Clear for search
        }

        try {
            const response = await fetch(url, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const articles = await response.json();
            
            articles.forEach((art, index) => {
                const card = `
                    <div class="news-card">
                        <img src="${art.image_url}" alt="${art.title}" loading="lazy">
                        <div class="news-content">
                            <h3>${art.title}</h3>
                            <p>${art.summary.substring(0, 100)}...</p>
                            <div class="news-meta">
                                <span>${art.source}</span>
                                <span>${new Date(art.published_at).toLocaleDateString('en-GB')}</span>
                            </div>
                            <br>
                            <a href="/news/${art.slug}.html" class="read-more">Read →</a>
                        </div>
                    </div>
                `;
                list.innerHTML += card;
                
                // Show Middle Ad after item 6
                if(offset === 0 && index === 5) {
                    document.getElementById('middleAd').style.display = 'block';
                }
            });

            if(articles.length < 12) {
                document.getElementById('loadMoreBtn').style.display = 'none';
                document.getElementById('noMoreNews').style.display = 'block';
            }
        } catch (err) {
            console.error('Error fetching news:', err);
        }
    }

    function searchNews() {
        offset = 0;
        fetchNews(true);
    }

    function loadMore() {
        offset += 12;
        fetchNews();
    }

    // Initial Load
    fetchNews();
</script>
