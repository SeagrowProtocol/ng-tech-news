<script>
const API_URL = 'https://remoteng-api.onrender.com';
const SITE_URL = 'https://remoteng.com.ng';

const urlParams = new URLSearchParams(window.location.search);
const jobSlug = urlParams.get('job');

// Format description to handle any text properly
function formatDescription(text) {
  if (!text) return '<p>No description available.</p>';

  // Escape HTML to prevent XSS
  text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Convert line breaks to paragraphs
  text = text.replace(/\r\n\r\n|\n\n/g, '</p><p>');
  text = text.replace(/\r\n|\n/g, '<br>');

  // Convert bullet points to lists
  text = text.replace(/•\s/g, '<li>');
  text = text.replace(/-\s/g, '<li>');
  text = text.replace(/<li>/g, '<ul><li>');
  text = text.replace(/<\/li>(?!<li>)/g, '</li></ul>');

  // Wrap in paragraph if not already
  if (!text.startsWith('<p>')) {
    text = '<p>' + text + '</p>';
  }

  return text;
}

async function loadJob() {
  if (!jobSlug) {
    document.getElementById('job-content').innerHTML = '<div class="error">Job not specified</div>';
    return;
  }

  try {
    const res = await fetch(`${API_URL}/api/jobs/${jobSlug}`);
    if (!res.ok) throw new Error('Job not found');
    const job = await res.json();

    const salaryObj = job.salary && /\d/.test(job.salary)? {
      "@type": "MonetaryAmount",
      "currency": "USD",
      "value": {
        "@type": "QuantitativeValue",
        "value": job.salary.match(/\d+/)?.[0] || "0",
        "unitText": "YEAR"
      }
    } : null;

    const jobSchema = {
      "@context": "https://schema.org/",
      "@type": "JobPosting",
      "title": job.title,
      "description": job.description,
      "datePosted": job.posted_at,
      "hiringOrganization": {
        "@type": "Organization",
        "name": job.company,
        "sameAs": SITE_URL
      },
      "jobLocation": {
        "@type": "Place",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "Remote"
        }
      },
      "employmentType": "FULL_TIME",
      "baseSalary": salaryObj
    };

    document.title = `${job.title} at ${job.company} - RemoteNG`;
    document.querySelector('meta[name="description"]').content = `Apply to ${job.title} at ${job.company}. Remote job with ${job.salary || 'competitive salary'}. ${job.description.substring(0, 150)}`;
    document.querySelector('meta[property="og:title"]').content = `${job.title} at ${job.company}`;
    document.querySelector('meta[property="og:description"]').content = job.description.substring(0, 160);
    document.querySelector('meta[property="og:url"]').content = `${SITE_URL}/job-details.html?job=${job.slug}`;
    document.querySelector('link[rel="canonical"]').href = `${SITE_URL}/job-details.html?job=${job.slug}`;

    const formattedDesc = formatDescription(job.description);

    document.getElementById('job-content').innerHTML = `
<section class="job-hero">
<div class="container">
<h1>${job.title}</h1>
<div class="company">${job.company}</div>
<div class="job-meta">
  ${job.salary? `<div class="salary-badge">${job.salary}</div>` : ''}
  <div class="meta-badge">🌍 Remote</div>
  <div class="meta-badge">Full-time</div>
  <div class="meta-badge">Posted ${new Date(job.posted_at).toLocaleDateString()}</div>
</div>
</div>
</section>

<section class="section">
<div class="container">
<div class="job-card">
<h2>Job Description</h2>
<div class="job-description">${formattedDesc}</div>
</div>

<div class="apply-section">
<a href="${SITE_URL}/go.html?url=${encodeURIComponent(job.url)}&job_id=${job.id}" class="btn" target="_blank" rel="nofollow">Apply for this Job →</a>
<p style="margin-top: 16px; color: var(--gray-500); font-size: 14px;">You’ll be redirected to the company’s application page</p>
</div>

<div class="back-link">
<a href="${SITE_URL}/remote-jobs.html">← Back to all jobs</a>
</div>
</div>
</section>
<script type="application/ld+json">${JSON.stringify(jobSchema)}<\/script>
    `;
  } catch (err) {
    document.getElementById('job-content').innerHTML = '<div class="error">Job not found</div>';
    document.title = 'Job Not Found - RemoteNG';
  }
}

loadJob();
</script>
