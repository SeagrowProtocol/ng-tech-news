<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5976755923016832" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Details - RemoteNG</title>
  <meta name="description" content="Remote job details">
  <meta property="og:title" content="Job Details - RemoteNG">
  <meta property="og:description" content="Remote job details">
  <meta property="og:url" content="https://remoteng.com.ng/job-details.html">
  <meta property="og:type" content="article">
  <meta property="og:image" content="https://remoteng.com.ng/logo.png">
  <link rel="icon" href="https://remoteng.com.ng/logo.png">
  <link rel="canonical" href="https://remoteng.com.ng/job-details.html">

  <style>
  :root {
    --blue-dark: #1e3a8a;
    --blue: #3b82f6;
    --blue-light: #dbeafe;
    --blue-cloud: #60a5fa;
    --green: #16a34a;
    --green-light: #dcfce7;
    --orange: #f59e0b;
    --gray-900: #0f172a;
    --gray-700: #334155;
    --gray-500: #64748b;
    --gray-300: #cbd5e1;
    --gray-100: #f1f5f9;
    --white: #ffffff;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    --radius: 12px;
  }

    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--gray-900);
    background: var(--gray-100);
    line-height: 1.6;
  }

.container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

  /* Header */
  header {
    background: var(--white);
    border-bottom: 1px solid var(--gray-300);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.85);
  }
.header-inner { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.logo img { width: 44px; height: 44px; border-radius: 10px; }
.logo-text { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.logo-text.remot { color: var(--blue-dark); }
.logo-text.eng { color: var(--blue); }
  nav { display: flex; gap: 28px; align-items: center; }
  nav a { color: var(--gray-700); text-decoration: none; font-weight: 500; transition: all 0.2s; font-size: 15px; }
  nav a:hover { color: var(--blue); }

  /* Buttons */
.btn {
    background: var(--blue-dark);
    color: var(--white);
    padding: 12px 28px;
    border-radius: var(--radius);
    text-decoration: none;
    font-weight: 600;
    border: none;
    cursor: pointer;
    display: inline-block;
    transition: all 0.2s;
    font-size: 15px;
  }
.btn:hover {
    background: var(--blue);
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }
.btn-secondary {
    background: var(--white);
    color: var(--blue-dark);
    border: 1px solid var(--gray-300);
  }
.btn-secondary:hover {
    background: var(--blue-light);
    border-color: var(--blue);
  }

  /* Hero */
.job-hero {
    background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 100%);
    color: var(--white);
    padding: 70px 0 50px;
  }
.job-hero h1 { font-size: 42px; margin-bottom: 16px; font-weight: 800; line-height: 1.2; letter-spacing: -1px; }
.job-hero.company { font-size: 22px; opacity: 0.95; margin-bottom: 24px; font-weight: 500; }

.job-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.meta-badge {
    background: rgba(255,255,255,0.15);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
  }
.salary-badge {
    background: var(--green);
    color: var(--white);
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
    box-shadow: var(--shadow-md);
  }

  /* Main Content */
.section { padding: 60px 0; }
.grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 30px;
  }

.job-card {
    background: var(--white);
    border: 1px solid var(--gray-300);
    border-radius: 20px;
    padding: 40px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
  }
.job-card h2 {
    font-size: 26px;
    color: var(--blue-dark);
    margin-bottom: 20px;
    font-weight: 700;
  }
.job-card h3 {
    font-size: 20px;
    color: var(--gray-900);
    margin: 28px 0 12px;
    font-weight: 700;
  }

.job-description { color: var(--gray-700); font-size: 16px; line-height: 1.9; }
.job-description p { margin-bottom: 18px; }
.job-description ul { margin: 16px 0; padding-left: 24px; }
.job-description li { margin-bottom: 10px; }

  /* Sidebar */
.sidebar-card {
    background: var(--white);
    border: 1px solid var(--gray-300);
    border-radius: 20px;
    padding: 28px;
    position: sticky;
    top: 100px;
    box-shadow: var(--shadow-sm);
  }
.sidebar-card h3 {
    font-size: 18px;
    margin-bottom: 16px;
    color: var(--gray-900);
  }
.info-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--gray-100);
    font-size: 15px;
  }
.info-row:last-child { border-bottom: none; }
.info-label { color: var(--gray-500); font-weight: 500; }
.info-value { color: var(--gray-900); font-weight: 600; }

.tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
.tag {
    background: var(--blue-light);
    color: var(--blue-dark);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }

  /* Apply Section */
.apply-section { text-align: center; padding: 30px 0; }
.apply-section.btn { font-size: 17px; padding: 16px 48px; }
.trust-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
    color: var(--gray-500);
    font-size: 14px;
  }

  /* Ad */
.ad-wrap {
    min-height: 250px;
    margin: 50px 0;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--white);
    border-radius: 20px;
    padding: 20px;
    border: 1px solid var(--gray-300);
  }
.ad-wrap small { display: block; color: var(--gray-500); font-size: 11px; margin-bottom: 8px; text-transform: uppercase; }

  /* Footer */
  footer {
    background: var(--gray-900);
    color: var(--gray-100);
    padding: 60px 0 35px;
    margin-top: 80px;
  }
.footer-simple { text-align: center; }
.footer-simple a { color: var(--gray-300); text-decoration: none; margin: 0 15px; transition: color 0.2s; }
.footer-simple a:hover { color: var(--blue-cloud); }
.footer-bottom {
    border-top: 1px solid var(--gray-700);
    padding-top: 25px;
    margin-top: 25px;
    text-align: center;
    color: var(--gray-500);
    font-size: 14px;
  }

.loading { text-align: center; padding: 100px 0; color: var(--gray-500); font-size: 18px; }
.error { text-align: center; padding: 100px 0; color: #dc2626; font-size: 18px; }

  @media (max-width: 968px) {
  .grid { grid-template-columns: 1fr; }
  .sidebar-card { position: static; }
  }
  @media (max-width: 768px) {
    nav { display: none; }
  .job-hero h1 { font-size: 30px; }
  .job-card { padding: 28px 24px; }
  .apply-section.btn { width: 100%; }
  }
  </style>
</head>
<body>
<header>
<div class="container">
<div class="header-inner">
<a href="https://remoteng.com.ng/remote-jobs.html" class="logo">
<img src="https://remoteng.com.ng/logo.png" alt="RemoteNG Logo">
<div class="logo-text">
<span class="remot">Remot</span><span class="eng">eng</span>
</div>
</a>
<nav>
<a href="https://remoteng.com.ng/remote-jobs.html">Browse Jobs</a>
<a href="https://remoteng.com.ng/tech-news.html">Tech News</a>
<a href="https://remoteng.com.ng/service.html">Career Services</a>
<a href="https://selar.com/17671617c4" class="btn">Get VIP Access</a>
</nav>
</div>
</div>
</header>

<div id="job-content" class="loading">Loading job details...</div>

<!-- Ad -->
<div class="container">
<div class="ad-wrap">
<small>Sponsored</small>
<script async="async" data-cfasync="false" src="https://fixesconsessionconsession.com/67abc4f6c4779907d9aa956165783490/invoke.js"></script>
<div id="container-67abc4f6c4779907d9aa956165783490"></div>
</div>
</div>

<footer>
<div class="container">
<div class="footer-simple">
<a href="https://remoteng.com.ng/remote-jobs.html">Browse Jobs</a>
<a href="https://remoteng.com.ng/tech-news.html">Tech News</a>
<a href="https://remoteng.com.ng/legal.html">About Us</a>
<a href="https://remoteng.com.ng/legal.html#privacy">Privacy Policy</a>
<a href="https://remoteng.com.ng/legal.html#terms">Terms of Service</a>
</div>
<div class="footer-bottom">
<p>&copy; 2026 RemoteNG. Connecting African talent to global remote opportunities.</p>
</div>
</div>
</footer>

<script>
const API_URL = 'https://remoteng-api.onrender.com';
const SITE_URL = 'https://remoteng.com.ng';

const urlParams = new URLSearchParams(window.location.search);
const jobSlug = urlParams.get('job');

function formatDescription(text) {
  if (!text) return '<p>No description available.</p>';
  text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  text = text.replace(/\r\n\r\n|\n\n/g, '</p><p>');
  text = text.replace(/\r\n|\n/g, '<br>');
  text = text.replace(/•\s/g, '<li>');
  text = text.replace(/-\s/g, '<li>');
  text = text.replace(/<li>/g, '<ul><li>');
  text = text.replace(/<\/li>(?!<li>)/g, '</li></ul>');
  if (!text.startsWith('<p>')) {
    text = '<p>' + text + '</p>';
  }
  return text;
}

async function loadJob() {
if (!jobSlug) {
    document.getElementById('job-content').innerHTML = `
      <section class="section">
        <div class="container" style="text-align:center; padding: 80px 20px;">
          <div style="max-width: 600px; margin: 0 auto;">
            <h1 style="font-size: 36px; color: var(--blue-dark); margin-bottom: 16px;">Oops! No job selected</h1>
            <p style="font-size: 18px; color: var(--gray-700); margin-bottom: 28px; line-height: 1.7;">
              Looks like you landed here directly. Please browse our latest remote jobs and pick one to see full details.
            </p>
            <a href="https://remoteng.com.ng/remote-jobs.html" class="btn" style="font-size: 17px; padding: 16px 40px;">
              Browse All Remote Jobs →
            </a>
            <div style="margin-top: 40px; padding: 20px; background: var(--blue-light); border-radius: 12px; color: var(--blue-dark); font-size: 14px;">
              💡 <b>Tip:</b> All our jobs pay in USD, EUR, or GBP and are 100% remote.
            </div>
          </div>
        </div>
      </section>
    `;
    document.title = 'Browse Remote Jobs - RemoteNG';
    return;
}
  try {
    const res = await fetch(`${API_URL}/api/jobs/${jobSlug}`);
    if (!res.ok) throw new Error('Job not found');
    const job = await res.json();

    const salaryObj = job.salary && /\d/.test(job.salary)? {
      "@type": "MonetaryAmount",
      "currency": "USD",
      "value": {
        "@type": "QuantitativeValue",
        "value": job.salary.match(/\d+/)?.[0] || "0",
        "unitText": "YEAR"
      }
    } : null;

    const jobSchema = {
      "@context": "https://schema.org/",
      "@type": "JobPosting",
      "title": job.title,
      "description": job.description,
      "datePosted": job.posted_at,
      "hiringOrganization": {
        "@type": "Organization",
        "name": job.company,
        "sameAs": SITE_URL
      },
      "jobLocation": {
        "@type": "Place",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "Remote"
        }
      },
      "employmentType": "FULL_TIME",
      "baseSalary": salaryObj
    };

    document.title = `${job.title} at ${job.company} - RemoteNG`;
    document.querySelector('meta[name="description"]').content = `Apply to ${job.title} at ${job.company}. Remote job with ${job.salary || 'competitive salary'}. ${job.description.substring(0, 150)}`;
    document.querySelector('meta[property="og:title"]').content = `${job.title} at ${job.company}`;
    document.querySelector('meta[property="og:description"]').content = job.description.substring(0, 160);
    document.querySelector('meta[property="og:url"]').content = `${SITE_URL}/job-details.html?job=${job.slug}`;
    document.querySelector('link[rel="canonical"]').href = `${SITE_URL}/job-details.html?job=${job.slug}`;

    const formattedDesc = formatDescription(job.description);

    // Use apply_url for new jobs, fallback to old redirect for old jobs
    const applyLink = job.apply_url || `${SITE_URL}/go.html?url=${encodeURIComponent(job.url)}&job_id=${job.id}`;

    document.getElementById('job-content').innerHTML = `
<section class="job-hero">
<div class="container">
<h1>${job.title}</h1>
<div class="company">${job.company}</div>
<div class="job-meta">
  ${job.salary? `<div class="salary-badge">${job.salary}</div>` : ''}
  <div class="meta-badge">🌍 100% Remote</div>
  <div class="meta-badge">💼 Full-time</div>
  <div class="meta-badge">📅 Posted ${new Date(job.posted_at).toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'})}</div>
</div>
</div>
</section>

<section class="section">
<div class="container">
<div class="grid">
  <div>
    <div class="job-card">
      <h2>About This Role</h2>
      <div class="job-description">${formattedDesc}</div>
    </div>

    <div class="job-card">
      <h2>Why Join ${job.company}?</h2>
      <div class="job-description">
        <p>At ${job.company}, we're building the future of work by embracing distributed teams and flexible schedules. You'll collaborate with talented professionals across time zones, work on challenging projects that matter, and grow your career without being tied to a physical office.</p>

        <h3>What You'll Gain</h3>
        <ul>
          <li>Work from anywhere with a flexible schedule that fits your lifestyle</li>
          <li>Competitive compensation with performance-based growth opportunities</li>
          <li>Access to learning resources, mentorship, and career development programs</li>
          <li>A diverse, inclusive team that values work-life balance and autonomy</li>
          <li>Modern tech stack and tools to help you do your best work</li>
        </ul>

        <h3>Career Growth Path</h3>
        <p>We invest in our people. Whether you're looking to deepen your technical expertise or move into leadership, ${job.company} provides clear progression paths, regular feedback, and opportunities to take on increasing responsibility.</p>
      </div>
    </div>

    <div class="apply-section">
      <a href="${applyLink}" class="btn" target="_blank" rel="nofollow sponsored noopener">Apply Now →</a>
      <div class="trust-badge">
        <span>✓</span> Verified job posting. No spam, no fake listings.
      </div>
    </div>
  </div>

  <div>
    <div class="sidebar-card">
      <h3>Job Overview</h3>
      <div class="info-row">
        <span class="info-label">Location</span>
        <span class="info-value">Remote Worldwide</span>
      </div>
      <div class="info-row">
        <span class="info-label">Job Type</span>
        <span class="info-value">Full-time</span>
      </div>
      <div class="info-row">
        <span class="info-label">Experience</span>
        <span class="info-value">Mid to Senior</span>
      </div>
      <div class="info-row">
        <span class="info-label">Posted</span>
        <span class="info-value">${new Date(job.posted_at).toLocaleDateString()}</span>
      </div>

      <h3 style="margin-top: 24px;">Skills & Keywords</h3>
      <div class="tag-list">
        <span class="tag">Remote Work</span>
        <span class="tag">Tech</span>
        <span class="tag">Career Growth</span>
        <span class="tag">Flexible Hours</span>
        <span class="tag">Global Team</span>
      </div>
    </div>

    <div class="sidebar-card" style="margin-top: 20px;">
      <h3>Application Tips</h3>
      <div class="job-description" style="font-size: 14px;">
        <ul>
          <li>Tailor your resume to highlight remote work experience</li>
          <li>Showcase projects that demonstrate self-motivation</li>
          <li>Prepare for async communication and video interviews</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<div style="text-align: center; margin-top: 40px;">
  <a href="${SITE_URL}/remote-jobs.html" class="btn btn-secondary">← Back to All Jobs</a>
</div>

</div>
</section>
<script type="application/ld+json">${JSON.stringify(jobSchema)}<\/script>
    `;
  } catch (err) {
    document.getElementById('job-content').innerHTML = '<div class="error">Job not found</div>';
    document.title = 'Job Not Found - RemoteNG';
  }
}

loadJob();
</script>
</body>
</html>
