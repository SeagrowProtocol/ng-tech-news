name: Deploy-NG-Tech

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Latest v4

      - name: Setup Pages
        uses: actions/configure-pages@v5 # Latest v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3 # Latest v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Latest v4
