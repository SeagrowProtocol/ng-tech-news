    <style>
        :root { 
            --primary: #00ff88; 
            --glass: rgba(255, 255, 255, 0.1);
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0; 
            background: var(--dark-bg); 
            color: #f1f5f9; 
            line-height: 1.6;
        }

        /* GLASS NAVIGATION */
        header { 
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--glass);
        }

        .logo { font-weight: 800; font-size: 24px; letter-spacing: -1px; color: var(--primary); text-transform: uppercase; }
        .stats-bar { font-size: 13px; color: #94a3b8; margin-top: 5px; }

        /* SEARCH HUB */
        .search-area { 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px;
            text-align: center;
        }

        .search-bar-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border-radius: 50px;
            padding: 5px 10px;
            border: 2px solid var(--glass);
        }
        
        .search-bar-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }

        .search-bar-wrap input {
            width: 100%;
            background: none;
            border: none;
            padding: 15px 20px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search-btn {
            background: var(--primary);
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
        }

        /* TABS */
        .tabs { display: flex; justify-content: center; gap: 15px; margin-top: 25px; overflow-x: auto; padding-bottom: 10px; }
        .tab-btn {
            background: var(--glass);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
        }
        .tab-btn.active { background: var(--primary); color: #000; }

        /* CONTENT GRID */
        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--glass);
            position: relative;
        }

        .card:hover { transform: translateY(-10px); border-color: var(--primary); }

        .card-img { width: 100%; height: 200px; object-fit: cover; }
        .card-content { padding: 20px; }
        .tag { font-size: 10px; background: var(--primary); color: #000; padding: 2px 8px; border-radius: 5px; font-weight: 800; margin-bottom: 10px; display: inline-block; }

        /* ADSTERRA NATIVE PLACEHOLDER */
        .ad-slot { 
            background: #000; 
            min-height: 100px; 
            margin: 20px 0; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            border-radius: 15px;
            border: 1px dashed #444;
        }

        /* JOKE BOX */
        .joke-container {
            background: linear-gradient(45deg, #1e293b, #0f172a);
            padding: 30px;
            margin: 40px auto;
            max-width: 800px;
            border-radius: 20px;
            text-align: center;
            border-left: 5px solid var(--primary);
        }

        /* FLOATING SOCIAL */
        .social-dock {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 9999;
        }

        .dock-item {
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 20px; text-decoration: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        footer { padding: 60px 20px; text-align: center; color: #64748b; font-size: 14px; }
        
        @media (max-width: 600px) {
            .main-grid { grid-template-columns: 1fr; }
            .logo { font-size: 20px; }
        }
    </style>
</head>
<body>

<script type='text/javascript' src='//pl29057773.profitablecpmratenetwork.com/e0/43/be/e043bec3a6648ab81ae3b9e75fa6e639.js'></script>

<header>
    <div class="logo">NG Tech Hub</div>
    <div class="stats-bar">
        <i class="fa-solid fa-bolt" style="color:var(--primary)"></i> 
        Active Users: <span id="userCount">1,402</span> | 
        Your Points: <span id="points" style="color:var(--primary); font-weight:bold;">0</span>
    </div>
</header>

<div class="search-area">
    <h1>Your Gateway to Global <span style="color:var(--primary)">Remote</span> Tech</h1>
    <p style="color:#94a3b8">Search the latest high-paying remote jobs and tech trends in Nigeria.</p>
    
    <div class="search-bar-wrap">
        <i class="fa-solid fa-magnifying-glass" style="margin-left: 15px; color:#64748b"></i>
        <input type="text" id="searchInput" placeholder="Try 'Frontend Developer' or 'Crypto'..." onkeyup="if(event.key==='Enter') executeSearch()">
        <button class="search-btn" onclick="executeSearch()">SEARCH</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="changeTab('tech', this)">LATEST TECH</button>
        <button class="tab-btn" onclick="changeTab('jobs', this)">REMOTE JOBS</button>
        <button class="tab-btn" onclick="changeTab('odds', this)">LIVE ODDS</button>
        <button class="tab-btn" onclick="changeTab('music', this)">NAIJA MUSIC</button>
    </div>
</div>

<div class="ad-slot">

        atOptions = { 'key' : 'e043bec3a6648ab81ae3b9e75fa6e639', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };

    <script type="text/javascript" src="//www.highperformanceformat.com/e043bec3a6648ab81ae3b9e75fa6e639/invoke.js"></script>
</div>

<div id="results" class="main-grid">
    </div>

<div class="joke-container">
    <h3 style="margin-top:0"><i class="fa-solid fa-face-laugh-beam"></i> Daily Naija Gist</h3>
    <p id="jokeDisplay" style="font-size: 18px; font-style: italic;">"Fetching the freshest gist from Lagos..."</p>
    <button onclick="getJoke()" style="background:none; border:1px solid var(--primary); color:var(--primary); padding:8px 20px; border-radius:10px; cursor:pointer;">New Joke</button>
</div>

<div class="social-dock">
    <a href="https://whatsapp.com/channel/0029Vb7pen79MF8zwOKKVk10" class="dock-item" style="background:#25D366"><i class="fa-brands fa-whatsapp"></i></a>
    <a href="https://t.me/latest_ng" class="dock-item" style="background:#0088cc"><i class="fa-brands fa-telegram"></i></a>

</div>

<footer>
    <p>Powered by NG Tech Hub API Engine &copy; 2026</p>
    <p style="margin-top:10px;">
        <a href="legal.html" style="color:var(--primary); text-decoration:none">Privacy Policy</a> | 
        <a href="legal.html" style="color:var(--primary); text-decoration:none">Terms of Service</a>
    </p>
</footer>

<script>
    const KEYS = {
        news: '3f8b592a6a9444d48a48114dc2e6328c',
        odds: '83c4173b194e9aef16318df0e08dd055',
        adz_id: 'ef02ca59',
        adz_key: '64df082acf621ff8ba9e989e97ed6793'
    };

    let activeTab = 'tech';
    let pts = localStorage.getItem('ng_pts') || 0;
    document.getElementById('points').innerText = pts;

    function addPts(n) {
        pts = parseInt(pts) + n;
        localStorage.setItem('ng_pts', pts);
        document.getElementById('points').innerText = pts;
    }

    function changeTab(t, btn) {
        activeTab = t;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        executeSearch();
    }

    async function executeSearch() {
        const q = document.getElementById('searchInput').value || 'latest';
        const grid = document.getElementById('results');
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> Loading Data...</div>';

        let apiURL = "";
        if (activeTab === 'tech' || activeTab === 'music') {
            apiURL = `https://newsapi.org/v2/everything?q=${activeTab}+${q}&apiKey=${KEYS.news}`;
        } else if (activeTab === 'jobs') {
            apiURL = `https://api.adzuna.com/v1/api/jobs/ng/search/1?app_id=${KEYS.adz_id}&app_key=${KEYS.adz_key}&results_per_page=12&what=${encodeURIComponent(q + ' remote')}`;
        } else if (activeTab === 'odds') {
            apiURL = `https://api.the-odds-api.com/v4/sports/upcoming/odds/?regions=eu&apiKey=${KEYS.odds}`;
        }

        const proxies = ["https://corsproxy.io/?", "https://api.allorigins.win/raw?url="];

        for (let proxy of proxies) {
            try {
                const response = await fetch(proxy + encodeURIComponent(apiURL));
                if (!response.ok) continue;
                const data = await response.json();
                let items = data.articles || data.results || (Array.isArray(data) ? data : []);
                
                if (items.length > 0) {
                    render(items);
                    return;
                }
            } catch (e) { console.log("Trying next proxy..."); }
        }

        // Global Job Fallback
        if (activeTab === 'jobs') {
            const fallback = `https://api.adzuna.com/v1/api/jobs/gb/search/1?app_id=${KEYS.adz_id}&app_key=${KEYS.adz_key}&results_per_page=12&what=${encodeURIComponent(q + ' remote')}`;
            try {
                const res = await fetch(proxies[0] + encodeURIComponent(fallback));
                const d = await res.json();
                render(d.results);
            } catch (e) { grid.innerHTML = "<p>Connection error. Please try again.</p>"; }
        }
    }

    function render(items) {
        const grid = document.getElementById('results');
        grid.innerHTML = '';
        items.slice(0, 12).forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'card';
            
            if (activeTab === 'jobs') {
                div.innerHTML = `
                    <div class="card-content">
                        <span class="tag">REMOTE VACANCY</span>
                        <h3 style="margin:10px 0">${item.title}</h3>
                        <p style="color:#94a3b8">${item.company.display_name}</p>
                        <div style="margin-top:20px; display:flex; justify-content:space-between; align-items:center;">
                            <span style="color:var(--primary); font-weight:bold">NGN High Pay</span>
                            <a href="${item.redirect_url}" target="_blank" class="search-btn" style="text-decoration:none; font-size:12px;" onclick="addPts(10)">APPLY NOW</a>
                        </div>
                    </div>`;
            } else if (activeTab === 'odds') {
                div.innerHTML = `
                    <div class="card-content">
                        <span class="tag">LIVE BETTING</span>
                        <h3>${item.home_team} vs ${item.away_team}</h3>
                        <p>${item.sport_title}</p>
                        <button class="search-btn" style="width:100%; margin-top:15px;" onclick="window.open('https://www.profitablecpmratenetwork.com/vcmv2e97bh?key=6f31d584592651da1bf92e0579ecf9e1')">BET NOW</button>
                    </div>`;
            } else {
                div.innerHTML = `
                    <img src="${item.urlToImage || 'https://images.unsplash.com/photo-1519389950473-47ba0277781c'}" class="card-img">
                    <div class="card-content">
                        <span class="tag">${activeTab} GIST</span>
                        <h3 style="font-size:16px">${item.title}</h3>
                        <a href="${item.url}" target="_blank" class="search-btn" style="display:block; text-align:center; text-decoration:none; margin-top:15px;" onclick="addPts(5)">READ MORE</a>
                    </div>`;
            }
            grid.appendChild(div);
        });
    }

    async function getJoke() {
        const jokeDisplay = document.getElementById('jokeDisplay');
        try {
            const r = await fetch('https://official-joke-api.appspot.com/random_joke');
            const d = await r.json();
            jokeDisplay.innerText = `${d.setup} ... ${d.punchline}`;
        } catch(e) { jokeDisplay.innerText = "Why did the Nigerian dev cross the road? To find 5G signal!"; }
    }

    function copyInvite() {
        navigator.clipboard.writeText(window.location.href);
        alert("Referral link copied! Share with friends to earn bonus points.");
    }

    // Auto-update user count for "Active" feel
    setInterval(() => {
        const current = parseInt(document.getElementById('userCount').innerText.replace(',',''));
        document.getElementById('userCount').innerText = (current + Math.floor(Math.random() * 5)).toLocaleString();
    }, 5000);

    executeSearch();
    getJoke();
</script>

</body>
