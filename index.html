<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>NG-Tech-Hub | Nigeria's Leading Tech News, Jobs & Naira Rates</title>
    <meta name="title" content="NG-Tech-Hub | Nigeria's Leading Tech News, Jobs & Naira Rates">
    <meta name="description" content="Get real-time updates on Nigerian Fintech, Remote Tech Jobs, Parallel Market Naira Rates, and Gadget Prices. Your all-in-one Nigerian tech portal.">
    <meta name="keywords" content="Nigeria Tech News, Fintech Nigeria, Remote Jobs Nigeria, Naira to Dollar Black Market, OPay, PalmPay, Lagos Tech Startups">
    <meta name="author" content="NG-Tech-Hub">
    <meta name="robots" content="index, follow">

    <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE_HERE" />

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourusername.github.io/ng-tech-news/">
    <meta property="og:title" content="NG-Tech-Hub | Nigeria's #1 Tech Portal">
    <meta property="og:description" content="Daily Tech News, Job Opportunities, and Currency Rates in Nigeria.">
    <meta property="og:image" content="https://via.placeholder.com/1200x630?text=NG-Tech-Hub+Nigeria">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="NG-Tech-Hub | Nigeria Tech News">
    <meta property="twitter:description" content="Real-time Nigerian tech updates and job alerts.">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsMediaOrganization",
      "name": "NG-Tech-Hub",
      "url": "https://yourusername.github.io/ng-tech-news/",
      "logo": "https://via.placeholder.com/200x200?text=NG",
      "sameAs": [
        "https://twitter.com/yourhandle",
        "https://facebook.com/yourpage"
      ]
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    
    <style>
        .news-card { transition: 0.3s; border: 1px solid #eee; }
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="bg-blue-700 text-white text-center py-2 text-sm font-medium">
        Trending: Remote Jobs | Naira Exchange Rates | Data Codes
    </div>

    <nav class="bg-white border-b sticky top-0 z-50 p-4 shadow-sm">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-3xl font-extrabold text-blue-700 tracking-tighter">NG-TECH-HUB</h1>
            <div class="relative w-full md:w-96 flex gap-2">
                <input id="searchInput" type="text" placeholder="Search news, jobs, or prices..." class="w-full border rounded-full px-5 py-2 outline-none focus:border-blue-500">
                <button onclick="handleSearch()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold hover:bg-blue-700">Search</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4">
        <div class="flex gap-2 my-6 overflow-x-auto pb-2 no-scrollbar">
            <button onclick="loadNews()" class="whitespace-nowrap bg-blue-600 text-white px-5 py-2 rounded-full shadow-md">All</button>
            <button onclick="loadNews('Naira Rate')" class="whitespace-nowrap bg-white border px-5 py-2 rounded-full">🇳🇬 Naira Rates</button>
            <button onclick="loadNews('Remote Jobs')" class="whitespace-nowrap bg-white border px-5 py-2 rounded-full">💼 Tech Jobs</button>
            <button onclick="loadNews('Fintech')" class="whitespace-nowrap bg-white border px-5 py-2 rounded-full">💳 Fintech</button>
            <button onclick="loadNews('Data Plans')" class="whitespace-nowrap bg-white border px-5 py-2 rounded-full">📡 Data Codes</button>
            <button onclick="loadNews('iPhone Prices')" class="whitespace-nowrap bg-white border px-5 py-2 rounded-full">📱 Gadgets</button>
        </div>

        <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p class="col-span-3 text-center py-20 text-gray-400 font-medium italic">Scanning Nigerian Tech Database...</p>
        </div>
    </main>

    <footer class="bg-gray-900 text-white p-10 mt-20 text-center">
        <p class="font-bold text-xl mb-2">NG-Tech-Hub</p>
        <p class="text-gray-400 text-sm max-w-md mx-auto italic">Providing the digital tools and real-time data Nigerians need to thrive in the global tech economy.</p>
        <div class="flex justify-center gap-6 mt-8 text-sm text-blue-400">
            <a href="mailto:owlfitcat@sendapp.uk" class="hover:underline">Contact</a>
            <a href="#" class="hover:underline">Privacy Policy</a>
            <a href="#" class="hover:underline">Sitemap</a>
        </div>
    </footer>

    <script>
        Parse.initialize("XRDkwT9qsas7ZGv1J4Bt0w9ZAzu7BRf8iOg4bv6Q", "fiTeawHiYkdabiwMvnnqGqSy7rKm2ZwxoEv0DCw3");
        Parse.serverURL = 'https://parseapi.back4app.com/';

        async function loadNews(category = null, term = null) {
            const grid = document.getElementById('newsGrid');
            const Article = Parse.Object.extend("Articles");
            let query;

            if(term) {
                const titleQuery = new Parse.Query(Article);
                titleQuery.matches("title", term, "i");
                const descQuery = new Parse.Query(Article);
                descQuery.matches("description", term, "i");
                query = Parse.Query.or(titleQuery, descQuery);
            } else {
                query = new Parse.Query(Article);
            }

            if(category) query.equalTo("category", category);
            query.descending("createdAt");
            query.limit(24);
            
            try {
                const results = await query.find();
                grid.innerHTML = "";
                
                if (results.length === 0) {
                    grid.innerHTML = `<div class="col-span-3 text-center py-20">
                        <p class="text-gray-500 text-lg">No updates found for "${term || category}".</p>
                        <button onclick="loadNews()" class="text-blue-600 font-bold mt-2 hover:underline">Show Latest News</button>
                    </div>`;
                    return;
                }

                results.forEach(post => {
                    grid.innerHTML += `
                        <div class="news-card bg-white rounded-xl overflow-hidden shadow-sm flex flex-col">
                            <div class="relative">
                                <img src="${post.get('urlToImage')}" class="w-full h-48 object-cover" onerror="this.src='https://via.placeholder.com/400x200?text=NG-Tech-Hub'">
                                <span class="absolute top-2 left-2 bg-blue-600 text-white text-[10px] px-2 py-1 rounded font-bold uppercase shadow-sm">${post.get('category') || 'Tech'}</span>
                            </div>
                            <div class="p-5 flex-grow">
                                <h2 class="font-bold text-lg leading-tight mb-2 hover:text-blue-700 transition cursor-pointer">${post.get('title')}</h2>
                                <p class="text-gray-600 text-sm line-clamp-3">${post.get('description') || 'Click read more to view full details on this update.'}</p>
                            </div>
                            <div class="p-5 pt-0">
                                <a href="${post.get('url')}" target="_blank" class="block text-center border-2 border-blue-600 text-blue-600 py-2 rounded-lg font-bold hover:bg-blue-600 hover:text-white transition-all duration-300">Read More</a>
                            </div>
                        </div>`;
                });
            } catch (e) { 
                grid.innerHTML = `<p class="col-span-3 text-center text-red-500 py-10">Database connection error. Check your internet.</p>`; 
            }
        }

        function handleSearch() { 
            const val = document.getElementById('searchInput').value.trim();
            if(val) loadNews(null, val); 
        }

        document.getElementById('searchInput').addEventListener("keypress", (e) => {
            if (e.key === "Enter") handleSearch();
        });

        loadNews();
    </script>
</body>
</html>
