<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NG-Tech-Hub | Nigeria's #1 Tech News Portal</title>
    <meta name="description" content="Daily updates on Nigerian Fintech, AI, Startups, and Crypto.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <style>
        .news-card { transition: 0.3s; border: 1px solid #eee; }
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="bg-white border-b sticky top-0 z-50 p-4">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-3xl font-extrabold text-blue-700">NG-TECH-HUB</h1>
            <div class="relative w-full md:w-96 flex gap-2">
                <input id="searchInput" type="text" placeholder="Search news..." class="w-full border rounded-full px-5 py-2 outline-none">
                <button onclick="handleSearch()" class="bg-blue-600 text-white px-4 py-2 rounded-full">Search</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4">
        <div class="flex gap-2 my-6 overflow-x-auto pb-2">
            <button onclick="loadNews()" class="bg-blue-600 text-white px-5 py-2 rounded-full">All</button>
            <button onclick="loadNews('Fintech')" class="bg-white border px-5 py-2 rounded-full">Fintech</button>
            <button onclick="loadNews('Artificial Intelligence')" class="bg-white border px-5 py-2 rounded-full">AI</button>
            <button onclick="loadNews('Crypto')" class="bg-white border px-5 py-2 rounded-full">Crypto</button>
        </div>

        <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p id="status-text">Loading news from database...</p>
        </div>
    </main>

    <footer class="bg-gray-900 text-white p-10 mt-20 text-center">
        <p>© 2026 NG-Tech-Hub</p>
        <div class="flex justify-center gap-6 mt-4 text-gray-400">
            <a href="about.html">About</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="mailto:owlfitcat@sendapp.uk">Contact</a>
        </div>
    </footer>

    <script>
        // Updated with your provided keys
        Parse.initialize("XRDkwT9qsas7ZGv1J4Bt0w9ZAzu7BRf8iOg4bv6Q", "fiTeawHiYkdabiwMvnnqGqSy7rKm2ZwxoEv0DCw3");
        Parse.serverURL = 'https://parseapi.back4app.com/';

        async function loadNews(category = null, term = null) {
            const grid = document.getElementById('newsGrid');
            const Article = Parse.Object.extend("Articles");
            const query = new Parse.Query(Article);
            
            if(category) query.equalTo("category", category);
            if(term) query.contains("title", term);
            
            query.descending("createdAt");
            query.limit(20); // Pull the latest 20 items
            
            try {
                const results = await query.find();
                console.log("Back4app Connection Successful. Objects found:", results.length);
                
                if (results.length === 0) {
                    grid.innerHTML = "<p class='col-span-3 text-center text-gray-500'>No news articles found in the database. Run the fetch job in Back4app!</p>";
                    return;
                }

                grid.innerHTML = "";
                results.forEach(post => {
                    grid.innerHTML += `
                        <div class="news-card bg-white rounded-xl overflow-hidden shadow-sm flex flex-col">
                            <img src="${post.get('urlToImage') || 'https://via.placeholder.com/400x200'}" class="w-full h-44 object-cover" onerror="this.src='https://via.placeholder.com/400x200'">
                            <div class="p-5 flex-grow">
                                <span class="text-xs font-bold text-blue-600 uppercase">${post.get('category') || 'Tech'}</span>
                                <h2 class="font-bold text-lg mt-2">${post.get('title')}</h2>
                            </div>
                            <div class="p-5 pt-0">
                                <a href="${post.get('url')}" target="_blank" class="block text-center bg-gray-100 py-2 rounded-lg font-semibold hover:bg-blue-50 transition">Read More</a>
                            </div>
                        </div>`;
                });
            } catch (e) { 
                console.error("Parse Error:", e);
                grid.innerHTML = `<p class='col-span-3 text-center text-red-500'>Error connecting to database: ${e.message}</p>`; 
            }
        }

        // Search when clicking button
        function handleSearch() { 
            loadNews(null, document.getElementById('searchInput').value); 
        }

        // Search when pressing "Enter" key
        document.getElementById('searchInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                handleSearch();
            }
        });

        // Initial load
        loadNews();
    </script>
</body>
</html>
