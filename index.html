<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NG-Tech-Hub | Tech News & Live Betting Odds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .news-card { transition: 0.3s; border: 1px solid #eee; }
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .bet-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <div class="bg-blue-700 text-white text-center py-2 text-xs font-medium">
        LATEST: Chelsea vs Arsenal Odds Updated | ₦500k Tech Grant Open
    </div>

    <nav class="bg-white border-b sticky top-0 z-50 p-4 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-blue-700">NG-TECH-HUB</a>
            <div class="hidden md:flex gap-4">
                <input id="searchInput" type="text" placeholder="Search..." class="border rounded-full px-4 py-1 text-sm outline-none bg-gray-100">
                <button onclick="handleSearch()" class="bg-blue-600 text-white px-4 py-1 rounded-full text-sm font-bold">Search</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-4 gap-8 mt-6">
        
        <div class="lg:col-span-3">
            <div class="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar">
                <button onclick="displayCategory('All')" class="bg-blue-600 text-white px-4 py-2 rounded-full text-xs font-bold">LATEST NEWS</button>
                <button onclick="displayCategory('Betting')" class="bg-green-600 text-white px-4 py-2 rounded-full text-xs font-bold">⚽ SPORTS ODDS</button>
                <button onclick="displayCategory('Fintech')" class="bg-white border px-4 py-2 rounded-full text-xs font-bold">FINTECH</button>
            </div>

            <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                </div>
        </div>

        <div class="lg:col-span-1 space-y-6">
            
            <div class="bet-gradient rounded-2xl p-5 text-white shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-sm uppercase tracking-wider">Live Match Odds</h3>
                    <span class="animate-pulse bg-red-500 text-[8px] px-2 py-0.5 rounded-full font-bold">LIVE</span>
                </div>
                
                <div id="oddsContainer" class="space-y-3">
                    <div class="bg-white/10 p-3 rounded-lg border border-white/10">
                        <p class="text-[10px] text-blue-200 mb-1">Premier League</p>
                        <div class="flex justify-between text-xs font-bold">
                            <span>Chelsea vs Arsenal</span>
                            <span class="text-green-400">2.10 | 3.40</span>
                        </div>
                    </div>
                </div>

                <a href="YOUR_SMART_LINK_HERE" target="_blank" class="block text-center bg-yellow-400 text-blue-900 mt-4 py-2 rounded-xl font-black text-xs hover:bg-yellow-300 transition">
                    BET NOW & WIN ₦100K
                </a>
            </div>

            <div class="bg-gray-200 h-[250px] rounded-xl flex items-center justify-center text-gray-400 text-xs border-2 border-dashed border-gray-300">
                ADSTERRA BANNER 300x250
            </div>

        </div>
    </main>

    <script>
        let allArticles = [];

        async function loadNews() {
            try {
                const response = await fetch('news.json');
                allArticles = await response.json();
                renderArticles(allArticles);
            } catch (e) {
                document.getElementById('newsGrid').innerHTML = "<p>Updating news database...</p>";
            }
        }

        function renderArticles(articles) {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = articles.map(post => `
                <div class="news-card bg-white rounded-xl overflow-hidden border border-gray-100 flex flex-col">
                    <img src="${post.urlToImage || 'https://via.placeholder.com/400x200'}" class="h-40 w-full object-cover">
                    <div class="p-4 flex-grow">
                        <h2 class="font-bold text-sm mb-2">${post.title}</h2>
                        <p class="text-gray-500 text-[10px] line-clamp-2">${post.description || ''}</p>
                    </div>
                    <div class="p-4 pt-0">
                        <a href="${post.url}" target="_blank" class="block text-center border border-blue-600 text-blue-600 py-1.5 rounded-lg text-[10px] font-bold hover:bg-blue-600 hover:text-white transition">READ MORE</a>
                    </div>
                </div>
            `).join('');
        }

        // Initialize
        loadNews();
    </script>
</body>
</html>
