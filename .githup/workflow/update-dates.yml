name: Update Last Modified Dates

on:
  push:
    branches: [main]
    paths:
      - '**.html'

jobs:
  update-dates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run date injection script
        run: node scripts/inject-date.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          git diff --staged --quiet || git commit -m "chore: update dateModified timestamps"
          git push
