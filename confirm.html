<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Confirmation | RemoteNG</title>
<link rel="icon" href="https://remoteng.com.ng/logo.png">
<style>
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
  background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); 
  min-height: 100vh; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  padding: 20px;
  margin: 0;
}
.container { 
  max-width: 500px; 
  background: white; 
  border-radius: 18px; 
  padding: 50px 40px; 
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.2);
}
h1 { 
  font-size: 28px; 
  color: #1e3a8a; 
  margin-bottom: 16px; 
}
p { 
  color: #374151; 
  margin-bottom: 30px; 
  line-height: 1.6;
}
.btn { 
  background: #1e3a8a; 
  color: white; 
  padding: 14px 32px; 
  border-radius: 10px; 
  text-decoration: none; 
  font-weight: 600; 
  display: inline-block;
  transition: background 0.2s;
}
.btn:hover {
  background: #1e40af;
}
.status-icon { 
  font-size: 64px; 
  margin-bottom: 20px; 
}
.success { color: #22c55e; }
.error { color: #ef4444; }
.loading { 
  border: 4px solid #f3f4f6;
  border-top: 4px solid #3b82f6;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin {
 0% { transform: rotate(0deg); }
 100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="container">
  <div id="content">
    <div class="loading"></div>
    <h1>Confirming your email...</h1>
    <p>Please wait while we verify your Email .</p>
  </div>
</div>

<script>
const API_URL = 'https://remoteng-api.onrender.com';
const SITE_URL = 'https://remoteng.com.ng';
const content = document.getElementById('content');

const params = new URLSearchParams(window.location.search);
const email = params.get('email');
const token = params.get('token');

if (!email || !token) {
  showError('Invalid Link', 'This confirmation link is missing or expired. Please sign up again.');
} else {
  confirmEmail(email, token);
}

async function confirmEmail(email, token) {
  try {
    const res = await fetch(`${API_URL}/confirm?email=${encodeURIComponent(email)}&token=${encodeURIComponent(token)}`);
    
    if (res.ok) {
      const html = await res.text();
      // Backend returns full HTML, but we want to use our styled page
      // So we check if it contains "Email confirmed" text
      if (html.includes('Email confirmed')) {
        showSuccess();
      } else {
        showAlreadyConfirmed();
      }
    } else {
      showError('Confirmation Failed', 'Something went wrong. The link may be expired or invalid.');
    }
  } catch (err) {
    console.error(err);
    showError('Network Error', 'Could not connect to the server. Please check your internet and try again.');
  }
}

function showSuccess() {
  content.innerHTML = `
    <div class="status-icon success">✓</div>
    <h1>Email Confirmed!</h1>
    <p>You're now subscribed to RemoteNG job alerts. You'll start receiving remote jobs in your inbox at 6PM WAT daily.</p>
  <a href="https://remoteng.com.ng/role-quiz.html" class="btn">Take Role Quiz →</a>
  `;
}

function showAlreadyConfirmed() {
  content.innerHTML = `
    <div class="status-icon success">✓</div>
    <h1>Already Confirmed</h1>
    <p>This email is already verified and subscribed to job alerts.</p>
   <a href="https://remoteng.com.ng/role-quiz.html" class="btn">Take Role Quiz →</a>
  `;
}

function showError(title, message) {
  content.innerHTML = `
    <div class="status-icon error">✗</div>
    <h1>${title}</h1>
    <p>${message}</p>
    <a href="${SITE_URL}" class="btn">Go to Homepage</a>
  `;
}
</script>
</body>
</html>
